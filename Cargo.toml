[package]
name = "rustwood"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GPU oblivious-tree gradient boosting with kernels written in pure Rust (cuda-oxide / Blackwell)"

# Standalone crate (detached from any parent workspace). Exclude the vendored cuda-oxide
# submodule so its crates resolve against their own workspace, not rustwood's.
[workspace]
exclude = ["external/cuda-oxide"]

[features]
default = ["gpu"]
gpu = ["dep:cuda-device", "dep:cuda-host", "dep:cuda-core", "dep:cuda-bindings"]
# Accumulate histogram cumulation / gain / replica-fold in f64 instead of f32
# (storage stays f32 — no extra memory). Build with: ./build.sh --features f64-hist
f64-hist = []
# f16 histogram path (needs a cuda-oxide with the f16 atomic; not in stock upstream).
f16-hist = []

[dependencies]
# cuda-oxide device/host/runtime crates (sibling checkout).
cuda-device = { path = "external/cuda-oxide/crates/cuda-device", optional = true }
cuda-host = { path = "external/cuda-oxide/crates/cuda-host", optional = true }
cuda-core = { path = "external/cuda-oxide/crates/cuda-core", optional = true }
cuda-bindings = { path = "external/cuda-oxide/crates/cuda-bindings", optional = true }
rayon = "1.11"

[[bin]]
name = "rustwood"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
