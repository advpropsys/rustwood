[package]
name = "rustwood"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GPU oblivious-tree gradient boosting with kernels written in pure Rust (cuda-oxide / Blackwell)"

# Standalone crate (detached from any parent workspace).
[workspace]

[features]
# Accumulate histogram cumulation / gain / replica-fold in f64 instead of f32
# (storage stays f32 — no extra memory). Build with: ./build.sh --features f64-hist
f64-hist = []

[dependencies]
# cuda-oxide device/host/runtime crates (sibling checkout).
cuda-device = { path = "../cuda-oxide/crates/cuda-device" }
cuda-host = { path = "../cuda-oxide/crates/cuda-host" }
cuda-core = { path = "../cuda-oxide/crates/cuda-core" }
cuda-bindings = { path = "../cuda-oxide/crates/cuda-bindings" }

[[bin]]
name = "rustwood"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
