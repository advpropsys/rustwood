[project]
name = "rustwood"
version = "0.1.0"
description = "Thin Python wrapper for the rustwood GPU/CPU oblivious-tree gradient booster"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rustwood*"]
